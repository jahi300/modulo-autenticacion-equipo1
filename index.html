<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="styles.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VetCare - Clinica Veterinaria</title>
</head>

<body>
    <div class="contenedor-principal">

        <div class="column1">
            <img id="img-login" src="imagen-login.jpg" alt="Doctora veterinaria">
        </div>

        <div class="column2">
            <div class="cuadro-login">
                <img class="img-logo" src="icono-patita.jpg" alt="">
                <h1 class="titulo">VetCare</h1>
                <p class="sub-titulo">Clínica Veterinaria</p>
                <h1 class="saludo">¡Qué alegría verte de nuevo! <br> Inicia sesión para seguir brindándole a tu mascota
                    el cuidado que se merece.</h1>
                <p class="msg-login">Inicia sesión</p>

                <label class="label-correo" for="correo">Correo</label>
                <input class="holder-correo" type="email" id="correo" name="correo" placeholder=" Digite su correo electronico">

                <label class="label-contraseña" for="contraseña">Contraseña</label>
                <input class="holder-contraseña"  type="password" id="contraseña" name="contraseña" placeholder=" Digite su contraseña">

                <button class="boton-iniciar-sesion">Iniciar Sesión</button>
            </div>
        </div>

    </div>
</body>

</html>
