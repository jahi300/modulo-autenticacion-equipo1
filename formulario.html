<!DOCTYPE html>
<html lang="es">

<head>
    <link rel="stylesheet" href="styles1.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Registro</title>
</head>

<body>
    <div class="contenedor-principal">
        <div class="cuadro-login">
            <h2 class="saludo">Registro de Usuario</h2>
            <p class="msg-login">Ingresa tus datos a continuación.</p>

            <form onsubmit="return false;">

                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" placeholder="Digite su nombre">


                <label for="apellido">Apellido</label>
                <input type="text" id="apellido" placeholder="Digite su apellido">


                <label for="telefono">Teléfono</label>
                <input type="tel" id="telefono" placeholder="Digite su teléfono">


                <label for="direccion">Dirección</label>
                <input type="text" id="direccion" placeholder="Digite su dirección">


                <div class="sub-seccion">
                    <p class="titulo-emergencia">Contacto de Emergencia</p>

                    <label for="emergencia-nombre">Nombre de contacto</label>
                    <input type="text" id="emergencia-nombre" placeholder="Nombre del contacto">

                    <label for="emergencia-telefono">Teléfono de contacto</label>
                    <input type="tel" id="emergencia-telefono" placeholder="Teléfono del contacto">
                </div>

                <!-- 6. Button Registrar -->
                <button type="button" class="boton-iniciar-sesion">Registrar</button>
            </form>
        </div>
    </div>
</body>

</html>
